name: 'setup R'
description: "Setup R for this particular repository's configuration."
inputs:
  setup-r:
    description: 'Whether to set up R and renv for this job.'
    required: false
    default: 'true'
  r-version:
    description: 'R version to use.'
    required: false
    default: 'renv'
  install-pandoc:
    description: 'Whether to install pandoc for jobs that render documentation.'
    required: false
    default: 'false'
  install-package:
    description: 'Whether to install the local package after restoring dependencies.'
    required: false
    default: 'false'
  install-dev-dependencies:
    description: 'Whether to install development dependencies from DESCRIPTION Suggests.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: 'setup just'
      uses: 'extractions/setup-just@v4'
    - name: 'install pandoc'
      if: ${{ inputs.setup-r == 'true' && inputs.install-pandoc == 'true' }}
      uses: 'r-lib/actions/setup-pandoc@v2'
    - name: 'setup R'
      if: ${{ inputs.setup-r == 'true' }}
      uses: 'r-lib/actions/setup-r@v2'
      with:
        r-version: '${{ inputs.r-version }}'
        use-public-rspm: true
    - name: 'install FlexStanR runtime dependencies'
      if: ${{ inputs.setup-r == 'true' }}
      run: |
        install.packages("parallelly")
        install.packages(
          "https://github.com/ACCIDDA/flexstanr/archive/98e1f4501efd26b7d998584de064fc07dfeb960b.tar.gz",
          repos = NULL,
          type = "source",
          dependencies = FALSE
        )
      shell: 'Rscript {0}'
    - name: 'setup renv'
      if: ${{ inputs.setup-r == 'true' }}
      uses: 'r-lib/actions/setup-renv@v2'
      env:
        GITHUB_PAT: '${{ github.token }}'
        RENV_CONFIG_PAK_ENABLED: 'false'
    - name: 'install development dependencies'
      if: ${{ inputs.setup-r == 'true' && inputs.install-dev-dependencies == 'true' }}
      run: 'just renv-install'
      shell: 'bash'
    - name: 'install SeverityEstimate'
      if: ${{ inputs.setup-r == 'true' && inputs.install-package == 'true' }}
      run: 'R CMD INSTALL .'
      shell: 'bash'
